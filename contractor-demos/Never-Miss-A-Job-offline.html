<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body>
<title>Never Miss A Job</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: one 16:9 stage scaled by rem. Top bar (brand, trade, timer), scene area, bottom rail (scene dots, key hints). Blueprint ground, hi-vis orange only for money. */
:root{
  --ink:#0B2540; --ink2:#12345A; --ink3:#0A1E34;
  --line:rgba(190,220,255,.16); --paper:#EAF2FB; --mute:#8FA9C4;
  --hi:#FF8A1F; --ok:#3DDC97; --bad:#FF5A5F; --blue:#5CB4FF;
  --display:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  color-scheme:dark;
  font-size:min(.8333vw,1.4815vh);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--paper);font-family:var(--body);overflow:hidden;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:4rem 4rem;background-position:-1px -1px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:.2rem solid var(--hi);outline-offset:.2rem}
.app{height:100%;display:grid;grid-template-rows:auto 1fr auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:1.4rem}
.bar{display:flex;align-items:center;gap:2rem;padding-bottom:1.2rem}
.brand{font-family:var(--display);font-weight:700;font-size:2.2rem;letter-spacing:.04em}
.brand b{color:var(--hi)}
.trades{display:flex;gap:.4rem;margin-left:auto}
.trades button{background:transparent;border:.1rem solid var(--line);padding:.5rem 1.2rem;border-radius:.4rem;font-size:1.2rem;font-weight:600;color:var(--mute)}
.trades button[aria-pressed="true"]{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.clock{font-family:var(--display);font-weight:600;font-size:1.8rem;min-width:9rem;text-align:right;font-variant-numeric:tabular-nums;color:var(--mute)}
.clock.warn{color:var(--hi)}
.stage{position:relative;min-height:0}
.scene{position:absolute;inset:0;display:flex;flex-direction:column;animation:fade .5s ease both}
@keyframes fade{from{opacity:0;transform:translateY(.8rem)}to{opacity:1;transform:none}}
h1,h2{font-family:var(--display);font-weight:700;margin:0;line-height:.95;text-wrap:balance}
h1{font-size:7.2rem}
h2{font-size:4.6rem;letter-spacing:.005em}
.sub{font-size:1.9rem;color:var(--mute);margin:1rem 0 0;max-width:62rem;line-height:1.35}
.hi{color:var(--hi)} .ok{color:var(--ok)} .bad{color:var(--bad)}
.num{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.cols{display:grid;gap:3rem;flex:1;min-height:0;margin-top:2rem}
.panel{background:var(--ink3);border:.1rem solid var(--line);border-radius:1rem;padding:1.8rem;min-height:0;display:flex;flex-direction:column}
.lbl{font-size:1.15rem;color:var(--mute);font-weight:500;letter-spacing:.02em;margin-bottom:.6rem}
.rail{display:flex;align-items:center;gap:1.6rem;padding-top:1rem;color:var(--mute);font-size:1.1rem}
.dots{display:flex;gap:.5rem}
.dots button{width:2.6rem;height:.5rem;border:0;padding:0;border-radius:.3rem;background:var(--line)}
.dots button.on{background:var(--hi)} .dots button.done{background:var(--mute)}
.keys{margin-left:auto}
kbd{font-family:var(--body);font-weight:600;border:.1rem solid var(--line);border-radius:.3rem;padding:.1rem .5rem;color:var(--paper)}
.beat{font-variant-numeric:tabular-nums}

/* hook */
.hook{display:grid;grid-template-columns:1.05fr 1fr;gap:4rem;flex:1;align-items:center}
.miss{display:flex;flex-direction:column;gap:1rem}
.mcard{display:grid;grid-template-columns:auto 1fr auto;gap:1.4rem;align-items:center;background:var(--ink3);border:.1rem solid var(--line);border-left:.5rem solid var(--bad);border-radius:.8rem;padding:1.3rem 1.6rem;animation:slide .5s ease both}
@keyframes slide{from{opacity:0;transform:translateX(3rem)}to{opacity:1;transform:none}}
.mcard .ic{width:3.4rem;height:3.4rem;border-radius:50%;background:rgba(255,90,95,.15);display:grid;place-items:center;color:var(--bad);font-size:1.6rem}
.mcard .t1{font-size:1.6rem;font-weight:600}
.mcard .t2{font-size:1.2rem;color:var(--mute);margin-top:.2rem}
.mcard .amt{font-family:var(--display);font-size:2.6rem;font-weight:700;color:var(--bad)}
.loss{margin-top:1.4rem}
.loss .num{font-size:9rem;color:var(--hi)}
.cta-line{font-family:var(--display);font-size:3.4rem;font-weight:700;color:var(--ok);margin-top:1rem;animation:fade .6s ease both}

/* call */
.call{grid-template-columns:1fr 1fr}
.wave{display:flex;align-items:center;gap:.25rem;height:2.4rem;margin-left:auto}
.wave i{display:block;width:.3rem;height:.5rem;background:var(--ok);border-radius:.2rem}
.wave.live i{animation:wv .9s ease-in-out infinite}
@keyframes wv{0%,100%{height:.5rem}50%{height:2.2rem}}
.callhead{display:flex;align-items:center;gap:1rem;font-size:1.3rem;color:var(--mute);padding-bottom:1rem;border-bottom:.1rem solid var(--line)}
.callhead .live{color:var(--ok);font-weight:600}
.chat{flex:1;overflow:hidden;-webkit-mask-image:linear-gradient(transparent,#000 3rem);mask-image:linear-gradient(transparent,#000 3rem);display:flex;flex-direction:column;justify-content:flex-end;gap:1rem;padding-top:1rem}
.b{max-width:85%;padding:1rem 1.4rem;border-radius:1.2rem;font-size:1.55rem;line-height:1.35;animation:fade .3s ease both}
.b small{display:block;font-size:1rem;font-weight:600;letter-spacing:.04em;margin-bottom:.25rem;opacity:.7}
.b.ai{background:var(--ink2);border:.1rem solid var(--line);align-self:flex-start}
.b.ca{background:var(--paper);color:var(--ink);align-self:flex-end}
.fields{display:flex;flex-direction:column;gap:.2rem}
.f{display:grid;grid-template-columns:11rem 1fr;gap:1rem;align-items:baseline;padding:.9rem 0;border-bottom:.1rem solid var(--line);font-size:1.5rem;min-height:3.9rem}
.f span:first-child{color:var(--mute);font-size:1.2rem}
.f span:last-child{font-weight:600;transition:background .6s,color .6s;border-radius:.3rem;padding:0 .3rem;margin:0 -.3rem}
.f span:last-child.flash{background:rgba(255,138,31,.25)}
.stamp{margin-top:auto;display:flex;gap:1rem;align-items:center;min-height:6.5rem}
.booked{font-family:var(--display);font-weight:700;font-size:3.4rem;color:var(--ink);background:var(--ok);padding:.4rem 1.6rem;border-radius:.5rem;transform:rotate(-2deg);animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{from{transform:scale(.4) rotate(-8deg);opacity:0}to{transform:rotate(-2deg);opacity:1}}
.sms{font-size:1.3rem;background:var(--ink2);border:.1rem solid var(--line);border-radius:1rem;padding:.9rem 1.2rem;color:var(--paper);max-width:30rem;animation:fade .4s ease both;line-height:1.35}

/* after hours */
.week{display:grid;grid-template-columns:5rem 1fr;gap:.6rem 1rem;align-items:center}
.hrs{display:grid;grid-template-columns:repeat(24,1fr);gap:.25rem}
.hrs.h span{font-size:.95rem;color:var(--mute);text-align:center}
.cell{aspect-ratio:1.9;border-radius:.25rem;background:rgba(190,220,255,.06);position:relative;transition:background .5s}
.cell.biz{background:rgba(92,180,255,.12)}
.cell.call{background:var(--blue)}
.cell.lost{background:var(--bad)}
.cell.got{background:var(--ok)}
.day{font-size:1.2rem;color:var(--mute);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:2rem;margin-top:1.6rem}
.stat .num{font-size:5.4rem}
.stat .lbl{font-size:1.2rem}
.legend{display:flex;gap:2rem;font-size:1.15rem;color:var(--mute);margin-top:1rem;align-items:center}
.legend i{display:inline-block;width:1.2rem;height:1.2rem;border-radius:.25rem;margin-right:.5rem;vertical-align:-.15rem}

/* reactivate */
.react{grid-template-columns:1.25fr 1fr}
.quotes{display:grid;grid-template-columns:repeat(26,1fr);gap:.35rem;align-content:start}
.q{aspect-ratio:1;border-radius:50%;background:rgba(190,220,255,.18);transition:background .4s,transform .4s}
.q.sent{background:var(--blue)} .q.rep{background:var(--hi);transform:scale(1.25)} .q.bk{background:var(--ok);transform:scale(1.4)}
.funnel{display:grid;grid-template-columns:repeat(4,1fr);gap:1.4rem;margin-top:1.4rem}
.funnel .num{font-size:4.4rem}
.thread{display:flex;flex-direction:column;gap:.8rem;flex:1;justify-content:flex-end;overflow:hidden}

/* reviews */
.rev{grid-template-columns:1fr 1.2rem 1.4fr}
.phone{background:var(--ink3);border:.1rem solid var(--line);border-radius:1rem;padding:1.6rem;display:flex;flex-direction:column;gap:1rem;min-height:0}
.stars{font-size:3rem;letter-spacing:.3rem;color:var(--line)}
.stars.on{color:var(--hi)}
.stars i{font-style:normal;transition:color .3s}
.rcard{background:var(--ink3);border:.1rem solid var(--line);border-radius:.8rem;padding:1.2rem 1.5rem;animation:slide .5s ease both}
.rcard .rs{color:var(--hi);font-size:1.5rem;letter-spacing:.15rem}
.rcard p{margin:.4rem 0 0;font-size:1.4rem;line-height:1.35}
.rcard .rn{font-size:1.1rem;color:var(--mute);margin-top:.4rem}
.rating{display:flex;align-items:baseline;gap:1.2rem}
.rating .num{font-size:6.4rem}
svg{display:block;max-width:100%}
.chartwrap{flex:0 0 17rem;min-height:0}
#rv{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-top:auto}
.rcard p{font-size:1.25rem}
.chartwrap text{font-family:var(--body);font-size:12px;fill:var(--mute)}

/* roi */
.roi{grid-template-columns:1fr 1.1fr}
.ctl{display:flex;flex-direction:column;gap:1.5rem}
.ctl label{display:flex;justify-content:space-between;font-size:1.5rem;font-weight:500}
.ctl label b{font-family:var(--display);font-size:2rem;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--hi);height:1.4rem;margin:.6rem 0 0}
.fee{display:flex;align-items:center;gap:1rem;font-size:1.5rem}
.fee input{width:9rem;background:var(--ink3);border:.1rem solid var(--line);color:var(--paper);font:inherit;font-size:1.6rem;padding:.4rem .8rem;border-radius:.4rem}
.big{display:flex;flex-direction:column;gap:2rem;justify-content:center}
.big .num.m{font-size:12rem;color:var(--hi)}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:2rem}
.row3 .num{font-size:5rem}
.src{font-size:1.1rem;color:var(--mute);margin-top:auto}

/* close */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:2.4rem;margin-top:3rem}
.step{border-top:.4rem solid var(--hi);padding-top:1.2rem}
.step h3{font-family:var(--display);font-size:3rem;margin:0 0 .5rem}
.step p{font-size:1.5rem;color:var(--mute);margin:0;line-height:1.4}
.contact{margin-top:auto;display:flex;gap:3rem;font-size:1.9rem;align-items:baseline}
.contact b{font-family:var(--display);font-size:3rem}

/* notes */
.notes{position:fixed;right:0;top:0;bottom:0;width:34rem;background:#06131f;border-left:.1rem solid var(--line);padding:2rem;font-size:1.35rem;line-height:1.5;transform:translateX(100%);transition:transform .3s;z-index:20;overflow:auto}
.notes.open{transform:none}
.notes h4{font-family:var(--display);font-size:2.2rem;margin:0 0 .8rem;color:var(--hi)}
.notes ul{padding-left:1.2rem;margin:.6rem 0}
.notes .tm{color:var(--mute);font-size:1.15rem}

@media (max-width:820px){
  :root{font-size:14px}
  body{overflow:auto}
  .app{height:auto;display:block}
  .stage{position:static}
  .scene{position:static}
  .hook,.cols,.call,.react,.rev,.roi{grid-template-columns:1fr!important;display:grid}
  h1{font-size:3.4rem} h2{font-size:2.6rem}
  .stats,.funnel,.row3,.steps{grid-template-columns:repeat(2,1fr)}
  .loss .num{font-size:5rem} .big .num.m{font-size:6rem}
  .keys{display:none} .quotes{grid-template-columns:repeat(13,1fr)}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="app" id="app">
  <div class="bar">
    <div class="brand" id="brand"></div>
    <div class="trades" id="trades" role="group" aria-label="Trade"></div>
    <div class="clock" id="clock">0:00 / 10:00</div>
  </div>
  <div class="stage" id="stage"></div>
  <div class="rail">
    <div class="dots" id="dots"></div>
    <span class="beat" id="beatinfo"></span>
    <span class="keys"><kbd>Space</kbd> next beat &nbsp; <kbd>←</kbd><kbd>→</kbd> scenes &nbsp; <kbd>T</kbd> trade &nbsp; <kbd>N</kbd> notes &nbsp; <kbd>S</kbd> voice &nbsp; <kbd>A</kbd> auto &nbsp; <kbd>F</kbd> fullscreen</span>
  </div>
</div>
<aside class="notes" id="notes" aria-label="Presenter notes"></aside>

<script>
(function(){
'use strict';
/* ---- Edit these before you present ---- */
var CONFIG={brand:'ProBot',brandAccent:'Solutions',email:'rob@probotsolutions.com',phone:'',fee:497};

var TRADES={
roofing:{label:'Roofing',biz:'Summit Roofing',ticket:8400,calls:15,hook:[9200,14500,6800],
  job:'roof leak repair',issue:'Water through bedroom ceiling',
  c1:"Hi, water's coming through my bedroom ceiling since the storm.",
  q2:'Sorry to hear that. Is it dripping right now?',a2:"Yes, a steady drip. I've put a bucket down.",
  urg:'Emergency: active leak',quote:'Repair $650 to $1,400. Inspection is free.',slot:'Sun 8:30 am, crew dispatched',
  hookLines:['Active leak after storm','Full roof replacement quote','Hail damage inspection'],
  reviews:[['Dana W.','They answered at 9 pm on a Saturday, and the leak was fixed by Sunday noon.'],['Marcus T.','Booked a free inspection in two minutes. Crew showed up on time.'],['Priya S.','Best roofer experience we have had. Quote was clear and fair.']],
  old:['Hi Mike, it\'s Summit Roofing. We quoted your roof back in March. Still want it handled? We have openings this month.',['Yes, can you do next week?','Price still the same?','We went with someone else.','Actually yes, please call me.']]},
hvac:{label:'HVAC',biz:'Northwind Heating & Air',ticket:4800,calls:35,hook:[7900,4200,5600],
  job:'furnace repair',issue:'Furnace blowing cold air',
  c1:"Hi, my furnace is blowing cold air and it's freezing in here.",
  q2:'I can help with that. Are there kids or elderly people at home tonight?',a2:'Yes, my mother is staying with us. She is 82.',
  urg:'Priority: no heat, vulnerable occupant',quote:'Diagnostic $89, most repairs $250 to $900.',slot:'Tonight 9:15 pm, tech on call',
  hookLines:['No heat, 24 degrees out','System replacement estimate','AC not cooling, 3 days'],
  reviews:[['Chris L.','Called at 10 pm, a tech was at the house within the hour. Heat back on.'],['Ana R.','The assistant booked us a same-day slot. No phone tag at all.'],['Tom B.','Honest pricing, quick fix. Already recommended them to my neighbors.']],
  old:['Hi Mike, it\'s Northwind Heating & Air. We quoted a new system last spring. Want an updated price before winter hits?',['Yes please, send it over.','Are there any rebates?','We already replaced it.','Can you come Thursday?']]},
plumbing:{label:'Plumbing',biz:'Bright Flow Plumbing',ticket:1850,calls:50,hook:[2400,1100,3600],
  job:'water heater replacement',issue:'Burst pipe under kitchen sink',
  c1:"Hi, a pipe just burst under my kitchen sink and water is going everywhere.",
  q2:'Okay, first turn off the shutoff valve under the sink. Can you do that?',a2:'Done. The water has stopped.',
  urg:'Emergency: burst pipe',quote:'Emergency visit $129, most repairs $250 to $700.',slot:'Tonight 8:00 pm, plumber en route',
  hookLines:['Burst pipe, kitchen flooding','Water heater replacement','Sewer backup, basement'],
  reviews:[['Jess M.','Burst pipe on a Saturday night. They answered right away and got me booked.'],['Omar K.','Clear price on the phone, plumber arrived when promised.'],['Linda H.','So much easier than calling five plumbers and getting voicemail.']],
  old:['Hi Mike, it\'s Bright Flow Plumbing. We quoted your water heater last year. Still need it done? We can fit you in this week.',['Yes, how soon?','What would it cost now?','Already replaced it.','Call me tomorrow please.']]}
};
var order=['roofing','hvac','plumbing'];
var trade='roofing';
function T(){return TRADES[trade]}

/* ---- helpers ---- */
function $(s,r){return (r||document).querySelector(s)}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms)})}
function money(n){return '$'+Math.round(n).toLocaleString('en-US')}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
var gen=0; // increments on scene change to cancel stale async work
function alive(g){return g===gen}
async function typeText(node,text,g,cps){
  cps=cps||70;node.textContent='';
  for(var i=0;i<text.length;i++){if(!alive(g))return;node.textContent+=text[i];await sleep(1000/cps)}
}
function countTo(node,to,ms,fmt,g){
  fmt=fmt||function(v){return Math.round(v).toLocaleString('en-US')};
  var from=0,t0=performance.now();
  return new Promise(function(res){
    (function f(t){
      if(!alive(g)){res();return}
      var p=Math.min(1,(t-t0)/ms),e=1-Math.pow(1-p,3);
      node.textContent=fmt(from+(to-from)*e);
      if(p<1)requestAnimationFrame(f);else res();
    })(t0);
  });
}
var voiceOn=false;
function speak(text,who){
  if(!voiceOn||!window.speechSynthesis)return Promise.resolve();
  return new Promise(function(res){
    try{
      var u=new SpeechSynthesisUtterance(text);
      u.rate=who==='ai'?1.02:.96;u.pitch=who==='ai'?1.15:.8;
      u.onend=res;u.onerror=res;speechSynthesis.cancel();speechSynthesis.speak(u);
      setTimeout(res,9000);
    }catch(e){res()}
  });
}

/* ---- scenes ---- */
var scenes=[];

scenes.push({name:'The problem',min:1,
 notes:['Ask: "When your phone rings at 7 pm on a Saturday, who answers?"','Let each missed call land. Say the dollar amount out loud.','Close the beat: "Same night, same calls. Watch."'],
 build:function(root,g){
  var t=T(),h=t.hook;
  root.innerHTML='<div class="hook"><div><h1>It\'s 7:42 pm.<br>You\'re at dinner.<br><span class="hi">Your phone rings.</span></h1><p class="sub">Three homeowners call tonight. You do not pick up.</p><div class="loss"><div class="lbl">Work that went to the next contractor on Google</div><div class="num" id="loss">$0</div></div><div id="cta"></div></div><div class="miss" id="miss"></div></div>';
  var total=0,times=['7:42 pm','8:15 pm','9:03 pm'];
  function add(i){return async function(){
    var c=document.createElement('div');c.className='mcard';
    c.innerHTML='<div class="ic">&#9742;</div><div><div class="t1">Missed call: '+esc(t.hookLines[i])+'</div><div class="t2">(555) 01'+(4+i)+'-22'+(91+i)+' &middot; '+times[i]+' &middot; Voicemail, never returned</div></div><div class="amt">-'+money(h[i])+'</div>';
    $('#miss',root).appendChild(c);
    var from=total;total+=h[i];
    await countTo($('#loss',root),total,900,function(v){return money(from+(total-from)*(v/total))},g);
    $('#loss',root).textContent=money(total);
  }}
  this.beats=[add(0),add(1),add(2),async function(){
    $('#cta',root).innerHTML='<div class="cta-line">Same night, with an AI receptionist &rarr;</div>';
  }];
 }});

scenes.push({name:'AI receptionist',min:2.5,
 notes:['Turn voice on (S) if the room is quiet. It is optional.','Point at the job card on the right: it fills itself while the call happens.','Say: "Name, address, urgency, price range, appointment. No one touched a keyboard."','Switch trades with T to show it fits their business.'],
 build:function(root,g){
  var t=T(),self=this;
  root.innerHTML='<h2>The call, answered in 2 seconds</h2><div class="cols call"><div class="panel"><div class="callhead"><span class="live" id="live">&#9679; Incoming call</span><span>(555) 014-2291 &rarr; '+esc(t.biz)+'</span><div class="wave" id="wave">'+new Array(18).join('<i></i>').replace(/<i><\/i>/g,function(){return '<i style="animation-delay:'+(Math.random()*.8).toFixed(2)+'s"></i>'})+'</div></div><div class="chat" id="chat"></div></div><div class="panel"><div class="lbl">Job card, filled automatically</div><div class="fields" id="fields"></div><div class="stamp" id="stamp"></div></div></div>';
  var F=[['Caller',''],['Phone',''],['Address',''],['Issue',''],['Urgency',''],['Estimate',''],['Appointment','']];
  $('#fields',root).innerHTML=F.map(function(f,i){return '<div class="f"><span>'+f[0]+'</span><span id="f'+i+'">&ndash;</span></div>'}).join('');
  function fill(i,v){var n=$('#f'+i,root);n.textContent=v;n.classList.add('flash');setTimeout(function(){n.classList.remove('flash')},900)}
  async function say(who,text){
    var b=document.createElement('div');b.className='b '+(who==='ai'?'ai':'ca');
    b.innerHTML='<small>'+(who==='ai'?'AVA, AI RECEPTIONIST':'CALLER')+'</small><span></span>';
    $('#chat',root).appendChild(b);
    var sp=speak(text,who);
    await typeText($('span',b),text,g,who==='ai'?62:48);
    await sp;
    await sleep(250);
  }
  function wave(on){var w=$('#wave',root);if(w)w.classList.toggle('live',on)}
  var greet='Thanks for calling '+t.biz+', this is Ava. How can I help?';

scenes.push({name:'24/7 coverage',min:1.5,
 notes:['Blue squares are calls coming in across one typical week. Dim columns are when you are on the job or asleep.','Beat 1: "These red ones are the calls that hit voicemail."','Beat 2: "Now every one of them gets answered and booked."','These are illustrative figures. Offer to run it on their real call log.'],

  var cells=[],after=0,total=0,html='<div class="week"><span></span><div class="hrs h">';

scenes.push({name:'Your numbers',min:2,
 notes:['Ask them for their real numbers and type them in live. This is the trust moment.','"Calls per week" and "% you miss": most owners say 20 to 40 percent. Let them argue the number down and watch the result still be large.','Close rate on booked calls defaults to a conservative 40%.','The fee is editable, so you can show any package.'],
 build:function(root,g){
  var t=T();
  root.innerHTML='<h2>Run it on your own numbers</h2><div class="cols roi"><div class="ctl panel"><div><label for="r1">Calls per week <b id="v1"></b></label><input type="range" id="r1" min="5" max="150" step="5" value="'+t.calls+'"></div><div><label for="r2">Calls you miss or can\'t answer well <b id="v2"></b></label><input type="range" id="r2" min="5" max="70" step="5" value="30"></div><div><label for="r3">Average job value <b id="v3"></b></label><input type="range" id="r3" min="200" max="20000" step="100" value="'+t.ticket+'"></div><div><label for="r4">Booked appointments you close <b id="v4"></b></label><input type="range" id="r4" min="10" max="80" step="5" value="40"></div><div><label for="r5">Old quotes in your files <b id="v5"></b></label><input type="range" id="r5" min="0" max="1000" step="25" value="300"></div><div class="fee"><label for="fee">Monthly fee</label><span>$</span><input id="fee" type="number" min="0" step="50" value="'+CONFIG.fee+'"></div></div><div class="big panel"><div><div class="lbl">Extra revenue per month from answered calls</div><div class="num m" id="o1">$0</div></div><div class="row3"><div><div class="num ok" id="o2">0x</div><div class="lbl">return on the fee</div></div><div><div class="num" id="o3">0 days</div><div class="lbl">to pay for itself</div></div><div><div class="num hi" id="o4">$0</div><div class="lbl">one-time from old leads</div></div></div><div class="src">Estimates from the figures you enter. The AI is assumed to book half of the missed calls and win back 4% of old quotes. Results vary by business.</div></div></div>';
  function v(id){return +$('#'+id,root).value}
  var last=0;
  function calc(){

 notes:['Offer a 14-day pilot on their own number: "We set it up, you call it yourself first, then it goes live."','Close with the one-line ask: "Which of these five would you want running first?"'],
 build:function(root,g){

  this.beats=[];
 }});

/* ---- engine ---- */
var cur=-1,beat=0,busy=false,started=false,t0=0,auto=false,autoTimer=null;
var stage=$('#stage');
function renderBar(){
  $('#brand').innerHTML=esc(CONFIG.brand)+' <b>'+esc(CONFIG.brandAccent)+'</b>';
  var tr=$('#trades');tr.innerHTML='';
  order.forEach(function(k){var b=document.createElement('button');b.textContent=TRADES[k].label;b.setAttribute('aria-pressed',k===trade);b.onclick=function(){setTrade(k)};tr.appendChild(b)});
}
function renderDots(){
  var d=$('#dots');d.innerHTML='';
  scenes.forEach(function(s,i){var b=document.createElement('button');b.title=(i+1)+'. '+s.name;b.setAttribute('aria-label',s.name);b.className=i===cur?'on':(i<cur?'done':'');b.onclick=function(){go(i)};d.appendChild(b)});
}
function renderNotes(){
  var s=scenes[cur];if(!s)return;
  $('#notes').innerHTML='<h4>'+(cur+1)+'. '+esc(s.name)+'</h4><div class="tm">Budget: about '+s.min+' min</div><ul>'+s.notes.map(function(n){return '<li>'+esc(n)+'</li>'}).join('')+'</ul>';
}
function info(){
  var s=scenes[cur];
  $('#beatinfo').textContent=s?(s.name+(s.beats.length?' · beat '+beat+'/'+s.beats.length:'')):'';
}
function go(i){
  if(i<0||i>=scenes.length)return;
  gen++;busy=false;beat=0;cur=i;
  try{if(window.speechSynthesis)speechSynthesis.cancel()}catch(e){}
  var root=document.createElement('div');root.className='scene';
  stage.innerHTML='';stage.appendChild(root);
  var s=scenes[i];s.beats=[];
  s.build(root,gen);
  renderDots();renderNotes();info();scheduleAuto();
}
async function next(){
  if(busy)return;
  startClock();
  var s=scenes[cur];
  if(beat<s.beats.length){
    busy=true;var g=gen;
    try{await s.beats[beat]()}catch(e){console.error(e)}
    if(!alive(g))return;
    beat++;busy=false;info();scheduleAuto();
  }else if(cur<scenes.length-1){go(cur+1)}
}
function setTrade(k){trade=k;renderBar();go(cur<0?0:cur)}
function startClock(){if(started)return;started=true;t0=Date.now()}
setInterval(function(){
  var e=started?Math.floor((Date.now()-t0)/1000):0,m=Math.floor(e/60),s=e%60;
  var c=$('#clock');c.textContent=m+':'+(s<10?'0':'')+s+' / 10:00';c.classList.toggle('warn',e>=480);
},500);
function scheduleAuto(){
  clearTimeout(autoTimer);
  if(!auto)return;
  var s=scenes[cur];
  if(s.beats.length===0&&cur===scenes.length-1)return;
  autoTimer=setTimeout(function(){if(auto)next()},s.beats.length&&beat>=s.beats.length?3000:1600);
}
document.addEventListener('keydown',function(e){
  if(e.target&&(e.target.tagName==='INPUT'))return;
  var k=e.key;
  if(k===' '||k==='Enter'||k==='PageDown'){e.preventDefault();next()}
  else if(k==='ArrowRight'){e.preventDefault();startClock();go(Math.min(cur+1,scenes.length-1))}
  else if(k==='ArrowLeft'||k==='PageUp'){e.preventDefault();go(Math.max(cur-1,0))}
  else if(/^[1-7]$/.test(k)){startClock();go(+k-1)}
  else if(k==='t'||k==='T'){setTrade(order[(order.indexOf(trade)+1)%order.length])}
  else if(k==='n'||k==='N'){$('#notes').classList.toggle('open')}
  else if(k==='s'||k==='S'){voiceOn=!voiceOn;$('#beatinfo').textContent='Voice '+(voiceOn?'on':'off')}
  else if(k==='a'||k==='A'){auto=!auto;$('#beatinfo').textContent='Auto-advance '+(auto?'on':'off');scheduleAuto()}
  else if(k==='r'||k==='R'){started=false;go(0)}
  else if(k==='f'||k==='F'){try{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen().catch(function(){})}catch(err){}}
});
stage.addEventListener('click',function(e){if(e.target.closest('input,button,label'))return;next()});
renderBar();go(0);
})();
</script>
